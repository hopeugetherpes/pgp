name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, audit and verify offline build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit all dependencies
        run: pnpm audit --audit-level low

      - name: Check TypeScript
        run: pnpm check

      - name: Build and verify web and offline editions
        run: pnpm build:vercel

      - name: Check committed builds match the current source
        run: >-
          git diff --exit-code --
          dist/index.html
          dist/assets/pgp.css
          dist/assets/pgp.js
          dist/pgp.html
          dist/pgp.html.sha256
